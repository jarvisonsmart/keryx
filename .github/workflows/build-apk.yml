name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the release (e.g. v0.1.0); tag pushes use the pushed tag'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'  # React Native's Android toolchain

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/modules/keryx-push/android/build.gradle') }}

      # The release keystore signs every published APK. It lives only in
      # GitHub secrets (see ../keryx-android-keys); the CI must never publish
      # a build signed with anything else, or existing installs can never update.
      - name: Decode the release keystore
        env:
          KERYX_KEYSTORE_BASE64: ${{ secrets.KERYX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KERYX_KEYSTORE_BASE64" ]; then
            echo "::error::KERYX_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release"
            exit 1
          fi
          echo "$KERYX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keryx-release.jks"

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.version }}"
          fi
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "apk_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The native project is generated (Continuous Native Generation): the
      # version and the release signing come from app.config.ts and
      # plugins/with-keryx-android.js.
      - name: Generate the Android project
        working-directory: app
        env:
          KERYX_VERSION_NAME: ${{ steps.version.outputs.apk_version }}
          KERYX_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: app/android
        env:
          KERYX_KEYSTORE_PATH: ${{ runner.temp }}/keryx-release.jks
          KERYX_KEYSTORE_PASSWORD: ${{ secrets.KERYX_KEYSTORE_PASSWORD }}
          KERYX_KEY_ALIAS: ${{ secrets.KERYX_KEY_ALIAS }}
          KERYX_KEY_PASSWORD: ${{ secrets.KERYX_KEY_PASSWORD }}
          # shown in the app footer (lib/build.ts) so a stale install is visible
          EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
        run: ./gradlew :keryx-push:testReleaseUnitTest assembleRelease

      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp app/android/app/build/outputs/apk/release/app-release.apk "dist-apk/keryx-${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Keryx ${{ steps.version.outputs.version }}
          files: dist-apk/*.apk
          generate_release_notes: true
